# profiles.yml — place this in ~/.dbt/profiles.yml (NOT inside project folder)
# Or set DBT_PROFILES_DIR env var to point to this file's directory.
#
# Fill in your Snowflake credentials.
# Use environment variables for passwords in production.

ecomm_snowflake:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"       # e.g. abc12345.us-east-1
      user:    "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role:    SYSADMIN
      database: ECOMM_DB
      warehouse: ECOMM_WH
      schema:   STAGING                                    # default schema; overridden per layer
      threads:  4
      client_session_keep_alive: false
      query_tag: dbt_dev_run

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user:    "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role:    SYSADMIN
      database: ECOMM_DB
      warehouse: ECOMM_WH
      schema:   STAGING
      threads:  8
      client_session_keep_alive: false
      query_tag: dbt_prod_run
